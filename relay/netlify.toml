[build]
  publish = "public"

# Телефон ходит сюда, а не на Cloudflare: мобильные операторы режут его IP.
# Сам кабинет по-прежнему пишет в gist через воркер — Netlify только дверь.
[[redirects]]
  from = "/api/*"
  to = "https://fina-api.fovkotov.workers.dev/api/:splat"
  status = 200
  force = true
