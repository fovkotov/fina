name: Fina
options:
  bundleIdPrefix: com.fina
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    DEVELOPMENT_TEAM: "KTU66V4H4X"
targets:
  Fina:
    type: application
    platform: iOS
    sources:
      - path: Fina
    dependencies:
      - target: FinaControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fina.app
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "KTU66V4H4X"
        INFOPLIST_KEY_CFBundleDisplayName: Fina
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
    info:
      path: Fina/Info.plist
      properties:
        CFBundleDisplayName: Fina
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.fina.app
            CFBundleURLSchemes:
              - fina
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.fina.deposit
            UIApplicationShortcutItemTitle: Внесение
            UIApplicationShortcutItemSubtitle: Добавить деньги
            UIApplicationShortcutItemIconSymbolName: arrow.down.circle.fill
          - UIApplicationShortcutItemType: com.fina.withdrawal
            UIApplicationShortcutItemTitle: Списание
            UIApplicationShortcutItemSubtitle: Убрать деньги
            UIApplicationShortcutItemIconSymbolName: arrow.up.circle.fill
    entitlements:
      path: Fina/Fina.entitlements

  FinaControls:
    type: app-extension
    platform: iOS
    sources:
      - path: FinaControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fina.app.controls
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "KTU66V4H4X"
        INFOPLIST_KEY_CFBundleDisplayName: Fina Controls
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    info:
      path: FinaControls/Info.plist
      properties:
        CFBundleDisplayName: Fina Controls
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FinaControls/FinaControls.entitlements
schemes:
  Fina:
    build:
      targets:
        Fina: all
        FinaControls: all
