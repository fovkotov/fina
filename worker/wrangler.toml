name = "fina-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Свой домен вместо workers.dev: тот у российских операторов режется по SNI.
# Старый адрес оставлен запасным — он ещё работает на домашнем интернете.
# app.fovkotov.lol — кабинет (статика); api.fovkotov.lol — тот же воркер, API.
routes = [
  { pattern = "api.fovkotov.lol", custom_domain = true },
  { pattern = "app.fovkotov.lol", custom_domain = true },
]
workers_dev = true

# Статика кабинета: собирается из web/ через `npm run build:cf`.
# /api/* всегда идёт в Worker; остальное — файлы из ../web/out.
[assets]
directory = "../web/out"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
# Worker решает сам: /api/* → код, остальное → env.ASSETS.fetch
run_worker_first = true

# GITHUB_TOKEN живёт в секретах: npx wrangler secret put GITHUB_TOKEN
[vars]
FINA_GIST_ID = "9ae03be0b8cb1a5a2d1818bd4492c8ea"
WEB_URL = "https://api.fovkotov.lol"
ALLOWED_ORIGINS = "https://api.fovkotov.lol,https://app.fovkotov.lol,https://fovkotov.github.io,http://localhost:3000"
